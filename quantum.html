<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>hydrogen // workpoop</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
        background: #000;
        color: #fff;
        font-family: "Courier New", Courier, monospace;
        height: 100%;
        overflow: hidden;
    }
    ::selection { background: #fff; color: #000; }

    #atom-canvas { display: block; width: 100vw; height: 100vh; }

    a.back {
        position: absolute; top: 16px; left: 18px;
        color: #444; text-decoration: none; font-size: 0.78em;
        letter-spacing: 1px; z-index: 5;
    }
    a.back:hover { color: #fff; }

    #orbitals {
        position: absolute; bottom: 22px; left: 50%; transform: translateX(-50%);
        display: flex; gap: 18px; z-index: 5;
    }
    .orb-btn {
        background: none; border: none; cursor: pointer;
        font-family: "Courier New", Courier, monospace;
        font-size: 0.78em; letter-spacing: 1px;
        color: #3a3a3a; padding: 4px 2px; transition: color .2s;
    }
    .orb-btn:hover { color: #999; }
    .orb-btn.active { color: #bfe8ff; }

    #info {
        position: absolute; bottom: 54px; left: 50%; transform: translateX(-50%);
        font-size: 0.68em; letter-spacing: 2px; color: #333;
        text-align: center; z-index: 5; pointer-events: none;
        transition: color .3s;
    }
</style>
</head>
<body>

<a href="index.html" class="back">&lt; back</a>

<canvas id="atom-canvas"></canvas>

<div id="info">1s &nbsp;·&nbsp; E = -13.6 eV</div>
<div id="orbitals"></div>

<script>
(function(){
"use strict";

const canvas = document.getElementById('atom-canvas');
const ctx = canvas.getContext('2d');
let W, H, DPR;
function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    if (typeof refitScale === 'function') refitScale();
}
window.addEventListener('resize', resize);
// initial resize() call happens further down, once `sampler` exists (refitScale needs it)

// ---------- hydrogen wavefunction math ----------

// generalized Laguerre polynomial L_k^a(x) via recurrence
function laguerre(k, a, x){
    if (k === 0) return 1;
    if (k === 1) return 1 + a - x;
    let Lkm2 = 1;
    let Lkm1 = 1 + a - x;
    let Lk = 0;
    for (let i = 2; i <= k; i++){
        Lk = ((2*i - 1 + a - x) * Lkm1 - (i - 1 + a) * Lkm2) / i;
        Lkm2 = Lkm1; Lkm1 = Lk;
    }
    return Lk;
}

// radial part shape (unnormalized is fine, we only need relative density)
function radialDensity(n, l, r){
    const k = n - l - 1;
    const rho = 2 * r / n;
    const L = laguerre(k, 2*l + 1, rho);
    const R = Math.exp(-rho/2) * Math.pow(rho, l) * L;
    return r * r * R * R; // D(r) = r^2 R(r)^2
}

// axially-symmetric (m=0) real angular density, function of theta only
function angularDensity(l, theta){
    const c = Math.cos(theta);
    let P; // proportional to associated legendre P_l^0(cos theta)
    if (l === 0) P = 1;
    else if (l === 1) P = c;
    else if (l === 2) P = 0.5 * (3*c*c - 1);
    else if (l === 3) P = 0.5 * (5*c*c*c - 3*c);
    else P = 1;
    return P * P * Math.sin(theta);
}

function buildSampler(n, l){
    // discretize r to build a rejection-sampling envelope + CDF-free rejection
    const rMax = (n*n) * 4.2 + l * 2;
    const steps = 800;
    let maxD = 0;
    const dGrid = new Array(steps + 1);
    for (let i = 0; i <= steps; i++){
        const r = rMax * i / steps;
        const d = radialDensity(n, l, r);
        dGrid[i] = d;
        if (d > maxD) maxD = d;
    }
    maxD *= 1.15;

    // deterministic view radius: smallest r containing ~92% of radial probability mass
    let total = 0;
    for (let i = 0; i <= steps; i++) total += dGrid[i];
    let running = 0, r92 = rMax;
    for (let i = 0; i <= steps; i++){
        running += dGrid[i];
        if (running / total >= 0.92){ r92 = rMax * i / steps; break; }
    }

    let maxA = 0;
    const aSteps = 400;
    for (let i = 0; i <= aSteps; i++){
        const th = Math.PI * i / aSteps;
        const a = angularDensity(l, th);
        if (a > maxA) maxA = a;
    }
    maxA *= 1.15;

    function sampleR(){
        for (let tries = 0; tries < 60; tries++){
            const r = Math.random() * rMax;
            const y = Math.random() * maxD;
            if (y <= radialDensity(n, l, r)) return r;
        }
        return rMax * 0.3;
    }
    function sampleTheta(){
        for (let tries = 0; tries < 60; tries++){
            const th = Math.random() * Math.PI;
            const y = Math.random() * maxA;
            if (y <= angularDensity(l, th)) return th;
        }
        return Math.PI / 2;
    }

    function sample(){
        const r = sampleR();
        const th = sampleTheta();
        const ph = Math.random() * Math.PI * 2;
        const st = Math.sin(th), ct = Math.cos(th);
        return {
            x: r * st * Math.cos(ph),
            y: r * st * Math.sin(ph),
            z: r * ct,
            scale: rMax
        };
    }
    sample.viewRadius = r92;
    return sample;
}

// ---------- orbitals ----------
const ORBITALS = [
    { label: '1s', n: 1, l: 0 },
    { label: '2s', n: 2, l: 0 },
    { label: '2p', n: 2, l: 1 },
    { label: '3s', n: 3, l: 0 },
    { label: '3p', n: 3, l: 1 },
    { label: '3d', n: 3, l: 2 },
    { label: '4f', n: 4, l: 3 },
];

const orbBar = document.getElementById('orbitals');
ORBITALS.forEach((o, i) => {
    const b = document.createElement('button');
    b.className = 'orb-btn' + (i === 0 ? ' active' : '');
    b.textContent = o.label;
    b.addEventListener('click', () => selectOrbital(i));
    orbBar.appendChild(b);
});
const infoEl = document.getElementById('info');

// ---------- particle system ----------
const PARTICLE_COUNT = 2600;
let particles = [];
let sampler = null;
let scaleFactor = 60;

function makeParticle(){
    const p = sampler();
    return {
        x: p.x, y: p.y, z: p.z,
        life: Math.random(),
        speed: 0.15 + Math.random() * 0.35,
        tw: Math.random() * Math.PI * 2
    };
}

function initParticles(){
    particles = [];
    for (let i = 0; i < PARTICLE_COUNT; i++){
        const pt = makeParticle();
        pt.life = Math.random(); // stagger lifecycles
        particles.push(pt);
    }
}

let currentIdx = 0;
function selectOrbital(i){
    currentIdx = i;
    [...orbBar.children].forEach((b, j) => b.classList.toggle('active', j === i));
    const o = ORBITALS[i];
    sampler = buildSampler(o.n, o.l);
    const e = (-13.6 / (o.n * o.n)).toFixed(2);
    infoEl.textContent = `${o.label}  ·  n=${o.n} l=${o.l}  ·  E = ${e} eV`;
    initParticles();
    refitScale();
}
let viewExtent = 1;
function refitScale(){
    // fit view scale to the current orbital's extent (deterministic, from the radial CDF) — set directly, no easing
    if (!sampler) return;
    viewExtent = sampler.viewRadius;
    scaleFactor = (Math.min(W, H) * 0.34) / viewExtent;
}

// electron marker (a single bright "measured position" dot that jumps periodically)
let marker = { x: 0, y: 0, z: 0, alpha: 0, targetAlpha: 0 };
let markerTimer = 0;
const MARKER_INTERVAL = 900; // ms

// nucleus glow
function drawNucleus(cx, cy){
    const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, 7);
    g.addColorStop(0, 'rgba(255,180,120,0.95)');
    g.addColorStop(0.4, 'rgba(255,140,80,0.5)');
    g.addColorStop(1, 'rgba(255,140,80,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(cx, cy, 7, 0, Math.PI*2);
    ctx.fill();
}

let angle = 0;
let last = performance.now();

function frame(now){
    const dt = Math.min(now - last, 50);
    last = now;
    angle += dt * 0.00012;

    // trail fade
    ctx.fillStyle = 'rgba(0,0,0,0.22)';
    ctx.fillRect(0, 0, W, H);

    const cx = W / 2, cy = H / 2;
    const cosA = Math.cos(angle), sinA = Math.sin(angle);
    const tiltA = Math.PI / 2.5; // slight tilt so 3D shape reads
    const cosT = Math.cos(0.55), sinT = Math.sin(0.55);

    ctx.globalCompositeOperation = 'lighter';

    for (let i = 0; i < particles.length; i++){
        const p = particles[i];
        p.life += dt * 0.00035 * p.speed;
        if (p.life > 1){
            const np = makeParticle();
            p.x = np.x; p.y = np.y; p.z = np.z;
            p.life = 0;
            p.speed = np.speed;
        }

        // rotate around vertical (z) axis
        const rx = p.x * cosA - p.y * sinA;
        const ry = p.x * sinA + p.y * cosA;
        // slight tilt around x axis for a 3D perspective read
        const ty = ry * cosT - p.z * sinT;
        const tz = ry * sinT + p.z * cosT;

        const depth = (ty + viewExtent) / (2 * viewExtent); // 0..1 roughly, front..back
        const screenX = cx + rx * scaleFactor;
        const screenY = cy - tz * scaleFactor;

        // opacity: fade in/out over lifecycle, dimmer when farther back
        const lifeFade = Math.sin(Math.PI * p.life);
        const depthFade = 0.35 + 0.65 * Math.max(0, Math.min(1, depth));
        const alpha = lifeFade * depthFade * 0.55;
        if (alpha <= 0.005) continue;

        const size = 0.6 + depthFade * 1.6;
        ctx.fillStyle = `rgba(140,210,255,${alpha.toFixed(3)})`;
        ctx.beginPath();
        ctx.arc(screenX, screenY, size, 0, Math.PI*2);
        ctx.fill();
    }

    // electron marker lifecycle
    markerTimer += dt;
    if (markerTimer > MARKER_INTERVAL){
        markerTimer = 0;
        const np = sampler();
        marker.x = np.x; marker.y = np.y; marker.z = np.z;
        marker.targetAlpha = 1;
    }
    marker.alpha += (marker.targetAlpha - marker.alpha) * 0.12;
    marker.targetAlpha *= 0.965; // slow decay after popping in

    {
        const rx = marker.x * cosA - marker.y * sinA;
        const ry = marker.x * sinA + marker.y * cosA;
        const ty = ry * cosT - marker.z * sinT;
        const tz = ry * sinT + marker.z * cosT;
        const screenX = cx + rx * scaleFactor;
        const screenY = cy - tz * scaleFactor;
        const a = marker.alpha;
        if (a > 0.02){
            const g = ctx.createRadialGradient(screenX, screenY, 0, screenX, screenY, 9);
            g.addColorStop(0, `rgba(255,255,255,${(0.9*a).toFixed(3)})`);
            g.addColorStop(0.3, `rgba(180,230,255,${(0.5*a).toFixed(3)})`);
            g.addColorStop(1, 'rgba(180,230,255,0)');
            ctx.fillStyle = g;
            ctx.beginPath();
            ctx.arc(screenX, screenY, 9, 0, Math.PI*2);
            ctx.fill();
        }
    }

    ctx.globalCompositeOperation = 'source-over';
    drawNucleus(cx, cy);

    requestAnimationFrame(frame);
}

resize();
selectOrbital(0);
// clear to black initially so trail-fade doesn't reveal a flash
ctx.fillStyle = '#000';
ctx.fillRect(0, 0, W, H);
requestAnimationFrame(frame);

})();
</script>
</body>
</html>
