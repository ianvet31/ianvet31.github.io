  <button data-k="Space"      style="right:16px;bottom:72px">JUMP</button>

<script>
'use strict';
// =====================================================================
//  WORKPOOP CASTLE
//  A tiny software rasterizer renders a 3D castle once, in two-point
//  perspective (camera has yaw but no pitch, so verticals stay vertical),
//  into a low-res pixel buffer with a z-buffer. Animated bits and the
//  player are drawn on top every frame, depth-tested against that buffer.
// =====================================================================
const W = 400, H = 225, HY = 148, F = 330;          // internal res, horizon line, focal length (px)
const CAM = { x: -34, y: 7.5, z: -66 };
let FX = 18 - CAM.x, FZ = 8 - CAM.z;
{ const l = Math.hypot(FX, FZ); FX /= l; FZ /= l; }
const RX = FZ, RZ = -FX;                             // camera right vector (horizontal)
const WATER_Y = -0.35;

function toCam(x, y, z) { const dx = x - CAM.x, dz = z - CAM.z; return [dx * RX + dz * RZ, y - CAM.y, dx * FX + dz * FZ]; }
function proj(x, y, z) { const c = toCam(x, y, z); return { x: W / 2 + F * c[0] / c[2], y: HY - F * c[1] / c[2], z: c[2] }; }
function groundAtScreen(sx, zc) { const xc = (sx - W / 2) * zc / F; return { x: CAM.x + RX * xc + FX * zc, z: CAM.z + RZ * xc + FZ * zc }; }

// ---------- utils ----------
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const BAY = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map(v => v / 16 - 0.47);
const bay = (x, y) => BAY[(y & 3) * 4 + (x & 3)];
function hash(a, b) {
  let n = Math.imul(a | 0, 374761393) + Math.imul(b | 0, 668265263);
  n = Math.imul(n ^ (n >>> 13), 1274126177);
  return ((n ^ (n >>> 16)) >>> 0) / 4294967296;
}
let seed = 1337; const rnd = () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296;
const c32 = (r, g, b, a = 255) => ((a << 24) | (b << 16) | (g << 8) | r) >>> 0;
const mix = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];

const RAMP = {};
const R = (k, arr) => RAMP[k] = arr.map(hex);
R('stone', ['#141226', '#201e36', '#2f2c48', '#423e5e', '#585378', '#726c93', '#928cb0', '#b6b0cc']);
R('roof',  ['#170a1c', '#2c0f26', '#4a1631', '#6c1f3b', '#932b45', '#bb404f', '#dc6461']);
R('wood',  ['#140c0a', '#271810', '#3f2718', '#5b3a21', '#7c512d', '#a06c3c']);
R('grass', ['#07110e', '#0c1b15', '#12291c', '#1a3923', '#244b2a', '#336033', '#46773b']);
R('dirt',  ['#120c0c', '#221815', '#36261e', '#4c3628', '#654a35', '#806043']);
R('water', ['#05081a', '#0a112c', '#101b40', '#182957', '#233b70']);
R('iron',  ['#0b0a12', '#1a1824', '#2c2a3c', '#45415a', '#625d7c']);
R('blue',  ['#0b0f34', '#141d5a', '#1f2c85', '#2d40ae', '#4560d4']);
R('gold',  ['#4a2e0c', '#87561a', '#c48a2c', '#ecc055', '#fff0a0']);
R('win',   ['#5e2410', '#a5461a', '#e0782a', '#f9a944', '#ffd36b', '#fff2bf']);
R('pine',  ['#040b0b', '#081614', '#0d211d', '#143128', '#1e4434', '#2e5c44']);
const WARM = hex('#ffad5a'), FOG = hex('#3c2558'), DARKGLASS = hex('#2a1810');
function ramp(name, v, d) { const r = RAMP[name]; return r[clamp(Math.round(v * (r.length - 1) + d), 0, r.length - 1)]; }

// ---------- geometry ----------
const polys = []; let OBJ = 0;
const solids = [];           // collision: {t:'box',x0,x1,z0,z1,top,bot} | {t:'cyl',cx,cz,r,top,bot}
const V = (x, y, z) => ({ x, y, z });
function poly(pts, mat, ex = {}) {
  const a = pts[0], b = pts[1], c = pts[2];
  const ux = b.x - a.x, uy = b.y - a.y, uz = b.z - a.z, vx = c.x - a.x, vy = c.y - a.y, vz = c.z - a.z;
  let nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
  const l = Math.hypot(nx, ny, nz) || 1; nx /= l; ny /= l; nz /= l;
  if (nx * (CAM.x - a.x) + ny * (CAM.y - a.y) + nz * (CAM.z - a.z) < 0) { nx = -nx; ny = -ny; nz = -nz; }
  polys.push(Object.assign({ pts, mat, n: { x: nx, y: ny, z: nz }, obj: OBJ }, ex));
}
function prism(fp, y0, y1, mat, ex = {}, top = true) {
  for (let i = 0; i < fp.length; i++) {
    const a = fp[i], b = fp[(i + 1) % fp.length];
    poly([V(a[0], y0, a[1]), V(b[0], y0, b[1]), V(b[0], y1, b[1]), V(a[0], y1, a[1])], mat, ex);
  }
  if (top) poly(fp.map(p => V(p[0], y1, p[1])), mat, Object.assign({}, ex, { cyl: null }));
}
function box(x0, x1, z0, z1, y0, y1, mat = 'stone', ex = {}) { OBJ++; prism([[x0, z0], [x1, z0], [x1, z1], [x0, z1]], y0, y1, mat, ex); }
function circ(cx, cz, r, seg) { const p = []; for (let i = 0; i < seg; i++) { const a = i / seg * Math.PI * 2; p.push([cx + Math.cos(a) * r, cz + Math.sin(a) * r]); } return p; }
function cyl(cx, cz, r, y0, y1, mat = 'stone', seg = 28) { OBJ++; prism(circ(cx, cz, r, seg), y0, y1, mat, { cyl: { cx, cz, r } }); }
function cone(cx, cz, r, y0, h, mat = 'roof', seg = 28) {
  OBJ++;
  const fp = circ(cx, cz, r, seg), apex = V(cx, y0 + h, cz);
  for (let i = 0; i < seg; i++) {
    const a = fp[i], b = fp[(i + 1) % seg];
    poly([V(a[0], y0, a[1]), V(b[0], y0, b[1]), apex], mat, { cone: { cx, cz, r, y0, h } });
  }
}
function obox(cx, cz, ang, hw, hd, y0, y1, mat = 'stone') { // box rotated about Y
  OBJ++;
  const c = Math.cos(ang), s = Math.sin(ang);
  const P = (u, v) => [cx + c * u - s * v, cz + s * u + c * v];
  prism([P(-hd, -hw), P(hd, -hw), P(hd, hw), P(-hd, hw)], y0, y1, mat);
}
// flat feature (window/door/banner/gate) on a vertical face; n = outward normal (nx,nz)
function feature(cx, cz, nx, nz, y0, w, h, mat, ex = {}, arch = true, off = 0.07) {
  OBJ++;
  const tx = -nz, tz = nx, bx = cx + nx * off, bz = cz + nz * off;
  const P = (s, y) => V(bx + tx * s, y, bz + tz * s);
  const hw = w / 2, y1 = y0 + h;
  const pts = arch ? [P(-hw, y0), P(hw, y0), P(hw, y1), P(0, y1 + w * 0.55), P(-hw, y1)]
                   : [P(-hw, y0), P(hw, y0), P(hw, y1), P(-hw, y1)];
  poly(pts, mat, Object.assign({ loc: { bx, bz, tx, tz, y0, w, h } }, ex));
}
function cylFeature(cx, cz, r, ang, y0, w, h, mat, ex, arch = true) {
  const nx = Math.cos(ang), nz = Math.sin(ang);
  feature(cx + nx * r, cz + nz * r, nx, nz, y0, w, h, mat, ex, arch, 0.14);
}
function ringMerlons(cx, cz, r, y, n = 14, h = 1.3) {
  for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2; obox(cx + Math.cos(a) * (r - 0.35), cz + Math.sin(a) * (r - 0.35), a, 0.5, 0.35, y, y + h); }
}
function merlonsX(x0, x1, z, y, h = 1.3, skip) { // along +x at given z (front edge)
  for (let x = x0 + 0.35; x + 0.9 <= x1; x += 1.9) { if (skip && x + 0.9 > skip[0] && x < skip[1]) continue; box(x, x + 0.95, z, z + 0.6, y, y + h); }
}
function merlonsZ(z0, z1, x, y, h = 1.3) {
  for (let z = z0 + 0.35; z + 0.9 <= z1; z += 1.9) box(x, x + 0.6, z, z + 0.95, y, y + h);
}
const solidBox = (x0, x1, z0, z1, top, bot = -9) => solids.push({ t: 'box', x0, x1, z0, z1, top, bot });
const solidCyl = (cx, cz, r, top, bot = -9) => solids.push({ t: 'cyl', cx, cz, r, top, bot });

let windowCount = 0;
const win = (cx, cz, nx, nz, y0, w = 1.0, h = 1.6) => feature(cx, cz, nx, nz, y0, w, h, 'win', { winId: windowCount++ });
const cwin = (cx, cz, r, a, y0, w = 1.0, h = 1.6) => cylFeature(cx, cz, r, a, y0, w, h, 'win', { winId: windowCount++ });
const slit = (cx, cz, nx, nz, y0) => feature(cx, cz, nx, nz, y0, 0.32, 1.4, 'dark', {}, true);

const TORCHES = [];
const ANCHORS = {};          // world points used by animations

function buildWorld() {
  // ---- ground (with an L-shaped moat cut out) ----
  OBJ++;
  const G = (x0, x1, z0, z1) => poly([V(x0, 0, z0), V(x1, 0, z0), V(x1, 0, z1), V(x0, 0, z1)], 'ground');
  G(-400, 400, -400, -17); G(-400, -17, -17, 400); G(52, 400, -17, 400); G(-17, -7, 40, 400); G(-7, 52, -7, 400);
  OBJ++;
  poly([V(-17, WATER_Y, -17), V(52, WATER_Y, -17), V(52, WATER_Y, -7), V(-17, WATER_Y, -7)], 'water');
  poly([V(-17, WATER_Y, -7), V(-7, WATER_Y, -7), V(-7, WATER_Y, 40), V(-17, WATER_Y, 40)], 'water');
  OBJ++;
  poly([V(-7, WATER_Y, -7), V(52, WATER_Y, -7), V(52, 0, -7), V(-7, 0, -7)], 'stone', { bank: 1 });
  poly([V(-7, WATER_Y, -7), V(-7, WATER_Y, 40), V(-7, 0, 40), V(-7, 0, -7)], 'stone', { bank: 1 });
  poly([V(52, WATER_Y, -17), V(52, WATER_Y, -7), V(52, 0, -7), V(52, 0, -17)], 'stone', { bank: 1 });

  // ---- keep (behind the curtain walls) ----
  box(13, 29, 9, 21, 0, 24);
  merlonsX(13, 29, 9, 24); merlonsZ(9, 21, 13, 24);
  for (let i = 0; i < 4; i++) { win(15.2 + i * 3.6, 9, 0, -1, 15.5); win(15.2 + i * 3.6, 9, 0, -1, 19.8, 0.9, 1.4); }
  for (let i = 0; i < 3; i++) win(13, 11.8 + i * 3.6, -1, 0, 17.5, 0.9, 1.5);
  feature(21, 9, 0, -1, 12.6, 2.2, 4.2, 'banner', {}, false);
  // bartizans on keep front corners
  cyl(13.4, 9.4, 1.35, 19, 26.2); cone(13.4, 9.4, 1.65, 26.2, 3.6);
  cyl(28.6, 9.4, 1.35, 19, 26.2); cone(28.6, 9.4, 1.65, 26.2, 3.6);
  // tall turret on keep
  cyl(25.5, 17.5, 2.7, 24, 34); cwin(25.5, 17.5, 2.7, -2.2, 29.3, 0.8, 1.4); cwin(25.5, 17.5, 2.7, -1.2, 27.6, 0.8, 1.4);
  cyl(25.5, 17.5, 3.1, 34, 35.2); cone(25.5, 17.5, 3.4, 35.2, 8.5);
  ANCHORS.keepSpire = V(25.5, 43.7, 17.5);
  box(16, 17.4, 12, 13.4, 24, 27.2);                 // chimney
  ANCHORS.chimney = V(16.7, 27.4, 12.7);

  // ---- back walls & towers (mostly hidden, but they fill the silhouette) ----
  box(4, 36, 24.5, 27.5, 0, 12); merlonsX(4, 36, 24.5, 12);
  box(-1.5, 1.5, 4, 22, 0, 12); merlonsZ(4, 22, -1.5, 12);
  for (let i = 0; i < 4; i++) slit(-1.5, 7 + i * 4.2, -1, 0, 5.5);
  box(38.5, 41.5, 4, 22, 0, 12); merlonsX(38.5, 41.5, 4, 12);
  cyl(0, 26, 4, 0, 18); ringMerlons(0, 26, 4.5, 19.4, 12); cyl(0, 26, 4.5, 18, 19.4); cone(0, 26, 4.2, 20.5, 7.5);
  cwin(0, 26, 4, -2.4, 11, 0.9, 1.5);
  cyl(40, 26, 4, 0, 18); cyl(40, 26, 4.5, 18, 19.4); cone(40, 26, 4.2, 19.4, 8);
  cwin(40, 26, 4, -2.0, 12, 0.9, 1.5);

  // ---- front-right curtain wall + gatehouse ----
  box(4, 15.5, -1.5, 1.5, 0, 12); merlonsX(4, 15.5, -1.5, 12);
  box(24.5, 37, -1.5, 1.5, 0, 12); merlonsX(24.5, 37, -1.5, 12);
  for (let i = 0; i < 3; i++) slit(6.5 + i * 3.4, -1.5, 0, -1, 5);
  for (let i = 0; i < 3; i++) slit(27 + i * 3.4, -1.5, 0, -1, 5);
  box(15.5, 24.5, -4.6, 3.2, 0, 14.5);
  merlonsX(15.5, 24.5, -4.6, 14.5, 1.3, [21.7, 23.2]);
  merlonsZ(-4.6, -1, 15.5, 14.5);
  feature(20, -4.6, 0, -1, 0, 3.4, 5.4, 'gate', {}, true, 0.06);
  feature(20, -4.6, 0, -1, 8.6, 1.9, 3.2, 'banner', {}, false);
  win(17.3, -4.6, 0, -1, 10.4, 0.8, 1.3); win(22.7, -4.6, 0, -1, 10.4, 0.8, 1.3);
  feature(15.5, -3.0, -1, 0, 4.5, 0.32, 1.4, 'dark');
  // ladder on gatehouse front
  OBJ++;
  { const x0 = 22.0, x1 = 22.95, z = -4.68;
    poly([V(x0, 0.3, z), V(x1, 0.3, z), V(x1, 14.6, z), V(x0, 14.6, z)], 'ladder', { clip: P => { const s = P.x - x0; const rail = s < 0.13 || s > x1 - x0 - 0.13; const rung = ((P.y - 0.3) % 0.55) < 0.12; return !(rail || rung); } }); }
  // torches beside the gate
  TORCHES.push(V(16.9, 5.3, -4.95), V(23.75, 5.3, -4.95));
  for (const t of TORCHES) box(t.x - 0.12, t.x + 0.12, -4.9, -4.6, 4.4, 5.1, 'iron');

  // ---- drawbridge ----
  box(17, 23, -17.6, -4.6, -0.25, 0.32, 'wood', { planks: 1 });
  ANCHORS.chainL = [V(17.2, 7.4, -4.65), V(17.2, 0.35, -13.6)];
  ANCHORS.chainR = [V(22.8, 7.4, -4.65), V(22.8, 0.35, -13.6)];

  // ---- front corner tower ----
  cyl(0, 0, 4.6, 0, 21);
  cyl(0, 0, 5.2, 21, 22.6);
  ringMerlons(0, 0, 5.2, 22.6, 16, 1.1);
  cone(0, 0, 4.7, 23.1, 9.5);
  ANCHORS.ftSpire = V(0, 32.6, 0);
  cylFeature(0, 0, 4.6, Math.atan2(-0.89, -0.46), 0, 1.9, 3.0, 'door');
  TORCHES.push(V(0 + Math.cos(-2.02) * 4.85 + 1.6, 3.9, Math.sin(-2.02) * 4.85 - 0.6));
  cwin(0, 0, 4.6, -2.4, 8.0); cwin(0, 0, 4.6, -1.55, 13.5); cwin(0, 0, 4.6, -2.0, 17.6, 0.9, 1.4); cwin(0, 0, 4.6, -3.0, 13.5, 0.9, 1.4);

  // ---- back-right tower (at the end of the right wall-walk) ----
  cyl(40, 0, 4.2, 0, 19);
  cyl(40, 0, 4.8, 19, 20.4);
  ringMerlons(40, 0, 4.8, 20.4, 14, 1.1);
  cone(40, 0, 4.4, 20.9, 8.8);
  ANCHORS.brtSpire = V(40, 29.7, 0);
  cylFeature(40, 0, 4.2, Math.atan2(-0.5, -0.87), 12, 1.25, 2.3, 'door');
  TORCHES.push(V(36.05, 14.9, -1.6));
  cwin(40, 0, 4.2, -1.75, 6.5); cwin(40, 0, 4.2, -1.3, 15, 0.9, 1.4);

  // ---- collision ----
  solidCyl(0, 0, 4.6, 99); solidCyl(40, 0, 4.2, 99); solidCyl(0, 26, 4.0, 99); solidCyl(40, 26, 4.0, 99);
  solidBox(4, 15.5, -1.5, 1.5, 12); solidBox(24.5, 37, -1.5, 1.5, 12);
  solidBox(4, 15.5, -1.5, -0.95, 13.3, 12); solidBox(24.5, 37, -1.5, -0.95, 13.3, 12);       // merlons
  solidBox(4, 37, 1.1, 1.5, 30, 12);                                                         // inner rail
  solidBox(15.5, 24.5, -4.6, 3.2, 14.5);
  solidBox(15.5, 21.7, -4.6, -4.0, 15.8, 14.5); solidBox(23.2, 24.5, -4.6, -4.0, 15.8, 14.5);
  solidBox(15.5, 16.1, -4.6, -1.0, 15.8, 14.5); solidBox(15.5, 24.5, 2.6, 3.2, 15.8, 14.5);
  solidBox(-1.5, 1.5, 4, 22, 99); solidBox(4, 36, 24.5, 27.5, 99); solidBox(38.5, 41.5, 4, 22, 99);
  solidBox(17, 23, -17.6, -4.6, 0.32);
  solidBox(-1.5, 41.5, 1.5, 24.5, 99);                                                       // courtyard (off-limits)
}
buildWorld();

// ---------- rasterize ----------
const N = W * H;
const ZB = new Float32Array(N).fill(Infinity);
const PID = new Int32Array(N).fill(-1);
const WP = new Float32Array(N * 3);
const KIND = new Uint8Array(N);  // 0 sky, 1 structure, 2 ground, 3 water, 4 tree/sprite
const COL = new Uint8ClampedArray(N * 4);

function clipNear(cs, nz) {
  const out = [];
  for (let i = 0; i < cs.length; i++) {
    const a = cs[i], b = cs[(i + 1) % cs.length], ai = a[2] >= nz, bi = b[2] >= nz;
    if (ai) out.push(a);
    if (ai !== bi) { const t = (nz - a[2]) / (b[2] - a[2]); out.push([a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, nz]); }
  }
  return out;
}
function rayDir(px, py) { const xs = (px - W / 2) / F, ys = (HY - py) / F; return [RX * xs + FX, ys, RZ * xs + FZ]; }
function rasterize() {

function update(dt, t) {

  const iz = (keys.ArrowUp || keys.KeyW ? 1 : 0) - (keys.ArrowDown || keys.KeyS ? 1 : 0);
  const jump = pressed.Space || pressed.KeyX || pressed.KeyZ || pressed.KeyK;
  const act = pressed.KeyE || pressed.Enter;

  const inLadder = P.x > LADDER.x0 && P.x < LADDER.x1 && P.z > LADDER.z0 && P.z < LADDER.z1;

    if (inLadder && iz > 0 && P.y < LADDER.top - 0.3 && P.y >= -0.1) { P.ladder = true; P.x = LADDER.xs; P.z = LADDER.zs; P.vy = 0; }

  }
  if (P.ladder) {
    P.y += iz * 4.2 * dt;
    if (iz) { P.run += dt * 9; if (Math.floor(P.run) % 2 && Math.random() < 0.15) SFX.climb(); }
    P.moving = iz !== 0;
    if (P.y >= LADDER.top) { P.y = LADDER.top; P.z = -3.6; P.ladder = false; P.ground = true; }
    else if (P.y <= 0.32 && iz < 0) { P.y = 0.32; P.ladder = false; P.z = -5.6; }
    else if (jump) { P.ladder = false; P.vy = 6; P.z -= 0.6; SFX.jump(); }
    else if (ix) { P.ladder = false; }
  } else {
    // controls follow the castle's own axes: left/right runs parallel to the front wall, up/down toward/away from it
    let mx = ix, mz = iz;
    const ml = Math.hypot(mx, mz);
    P.moving = ml > 0;

      const sp = 7.5 / ml;
      mx *= sp * dt; mz *= sp * dt;

      const ledge = (x, z) => P.ground && inMoat(x, z) && floorAt(x, z, P.y) < P.y - 0.6;
      if (!blocked(P.x + mx, P.z, P.y) && !ledge(P.x + mx, P.z)) P.x += mx;
      if (!blocked(P.x, P.z + mz, P.y) && !ledge(P.x, P.z + mz)) P.z += mz;

    } else { P.y = fl; P.vy = 0; P.ground = true; }

  else $prompt.style.display = 'none';
}

function drawFlag(a, len, hgt, t, small) {
  const q = proj(a.x, a.y, a.z), poleH = small ? 4 : 7;
  for (let k = 0; k < poleH; k++) put(q.x, q.y - k, C.pole);
  put(q.x, q.y - poleH, C.goldL);
  for (let i = 1; i <= len; i++) {
    const u = i / len, w = Math.sin(t * 5 - i * 0.55) * 1.4 * u, slope = Math.cos(t * 5 - i * 0.55);
    const hh = Math.max(1, Math.round(hgt * (1 - u * (small ? 0.7 : 0.25))));
    for (let k = 0; k < hh; k++) {
      let c = slope > 0.3 ? C.flagD : C.flagR;
      if (!small && k === Math.floor(hh / 2) && i > 2) c = C.flagG;
      put(q.x + i, q.y - poleH + 1 + k + w, c);
    }
  }
}

function drawFlame(tp, t, k) {
  const q = proj(tp.x, tp.y, tp.z), s = F / q.z, h = Math.max(3, Math.round(0.9 * s)), w = Math.max(1, Math.round(0.28 * s));
  for (let yy = 0; yy < h; yy++) {
    const u = yy / h, sway = Math.round(Math.sin(t * 13 + k * 3 + yy * 0.6) * u * 1.2);
    const ww = Math.round(w * (1 - u) + (Math.sin(t * 20 + yy + k) > 0.6 ? 1 : 0) * (1 - u));
    for (let xx = -ww; xx <= ww; xx++) {
      const e = Math.abs(xx) / (ww + 0.5) + u * 0.8 + Math.sin(t * 30 + xx * 3 + yy * 2) * 0.12;
      const c = e < 0.45 ? C.flame1 : e < 0.8 ? C.flame2 : e < 1.15 ? C.flame3 : C.flame4;
      put(q.x + xx + sway, q.y - yy, c, q.z - 0.3);
    }
  }
  if (Math.random() < 0.08) PARTS.push({ k: 'ember', x: tp.x, y: tp.y + 0.6, z: tp.z, vx: (Math.random() - .5) * 0.6, vy: 1.2 + Math.random(), vz: (Math.random() - .5) * 0.4, life: 0.9 + Math.random() * 0.6 });
}

function drawChest(t) {
  const q = proj(CHEST.x, CHEST.y, CHEST.z), s = F / q.z, w = Math.max(3, Math.round(0.55 * s)), h = Math.max(2, Math.round(0.42 * s)), z = q.z;
  for (let yy = 0; yy < h; yy++) for (let xx = -w; xx <= w; xx++) {
    const edge = Math.abs(xx) === w || yy === h - 1;
    put(q.x + xx, q.y - yy - 1, edge ? C.goldD : (xx === 0 && yy === Math.floor(h / 2)) ? C.goldL : c32(110, 66, 32), z);
  }
  if (!CHEST.open) { for (let xx = -w; xx <= w; xx++) { put(q.x + xx, q.y - h - 1, C.goldD, z); put(q.x + xx, q.y - h - 2, xx % 2 ? c32(140, 84, 40) : C.goldD, z); } }
  else { for (let yy = 0; yy < h + 1; yy++) put(q.x - w, q.y - h - 1 - yy, C.goldD, z); if (Math.sin(t * 6) > 0) put(q.x, q.y - h - 2, C.goldL, z); }
}

// ---------- render ----------
function render(t, dt) {
  ctx.drawImage(bgC, 0, 0);
  for (const s of STARS) {
    const b = s.b * (0.55 + 0.45 * Math.sin(t * s.sp + s.ph));
    if (b < 0.18) continue;
    const v = Math.round(150 + 105 * b);
    ctx.fillStyle = `rgb(${v},${v - 10},${Math.min(255, v + 20)})`;
    ctx.fillRect(s.x, s.y, 1, 1);
    if (s.big && b > 0.7) { ctx.fillStyle = 'rgba(200,190,255,0.55)'; ctx.fillRect(s.x - 1, s.y, 1, 1); ctx.fillRect(s.x + 1, s.y, 1, 1); ctx.fillRect(s.x, s.y - 1, 1, 1); ctx.fillRect(s.x, s.y + 1, 1, 1); }
  }
  // shooting star
  const ss = (t % 11) / 11;
  if (ss < 0.06) { const u = ss / 0.06, x0 = 60 + (Math.floor(t / 11) * 97) % 200, y0 = 10 + (Math.floor(t / 11) * 37) % 40;
    for (let k = 0; k < 10; k++) { const a = 1 - k / 10; ctx.fillStyle = `rgba(255,240,210,${a * (1 - u)})`; ctx.fillRect(Math.round(x0 + u * 70 - k * 2), Math.round(y0 + u * 25 - k * 0.7), 1, 1); } }
  for (const c of CLOUDS) {
    c.x += c.v * dt; if (c.x > W + 10) { c.x = -c.c.width - 10; }
    ctx.drawImage(c.c, Math.round(c.x), Math.round(c.y));
  }
  ctx.drawImage(castleC, 0, 0);

  FXB.fill(0);
  // moat: animated reflection with ripples + glints
  for (const j of WATERPX) {
    const x = j % W, y = (j / W) | 0;
    const wx = WP[j * 3], wz = WP[j * 3 + 2];
    const off = Math.round(Math.sin(y * 1.9 + t * 2.4 + wx * 0.3) * 0.9);
    const sx = clamp(x + off, 0, W - 1), k = y * W + sx, src = KIND[k] === 3 ? k : j;
    let c = c32(REFL[src * 3], REFL[src * 3 + 1], REFL[src * 3 + 2]);
    const g = Math.sin(wx * 1.4 + t * 1.6 + Math.sin(wz * 0.9 + t)) * Math.sin(wz * 2.3 - t * 1.2 + wx * 0.2);
    if (g > 0.86) c = C.glint;
    FXB[j] = c;
  }
  // windows flicker
  for (let id = 0; id < windowCount; id++) {
    const f = winFlick[id], px = winPixels[id]; if (!px) continue;
    f.t -= dt;
    if (f.t <= 0) { f.t = 3 + Math.random() * 12; f.off = hash(id, Math.floor(t)) < 0.06 ? !f.off : (f.off && Math.random() < 0.7 ? false : f.off); }
    if (!f.mode && !f.off) continue;
    const k = f.off ? 0.15 : 0.92 + Math.sin(t * 9 + id * 4) * 0.06 + Math.sin(t * 23 + id) * 0.05;
    for (const p of px) { const x = p.i % W, y = (p.i / W) | 0, c = ramp('win', p.g * k - (f.off ? 0.2 : 0), bay(x, y)); FXB[p.i] = f.off ? c32(18, 12, 30) : c32(c[0], c[1], c[2]); }
  }
  // drawbridge chains
  for (const ch of [ANCHORS.chainL, ANCHORS.chainR]) {
    const a = proj(ch[0].x, ch[0].y, ch[0].z), b = proj(ch[1].x, ch[1].y, ch[1].z); let n = 0;
    line(a.x, a.y, b.x, b.y, (x, y) => { put(x, y, (n++ % 2) ? c32(98, 93, 124) : c32(44, 42, 60), Math.min(a.z, b.z) - 0.2); });
  }
  TORCHES.forEach((tp, k) => drawFlame(tp, t, k));
  drawFlag(ANCHORS.keepSpire, 13, 6, t, false);
  drawFlag(ANCHORS.ftSpire, 7, 3, t + 1, true);
  drawFlag(ANCHORS.brtSpire, 6, 3, t + 2, true);
  drawChest(t);
  // chimney smoke
  if (Math.random() < 0.25) PARTS.push({ k: 'smoke', x: ANCHORS.chimney.x, y: ANCHORS.chimney.y, z: ANCHORS.chimney.z, vx: 0.6 + Math.random() * 0.4, vy: 1.2 + Math.random() * 0.5, vz: (Math.random() - .5) * 0.3, life: 4 + Math.random() * 2, max: 6 });
  // bats
  for (const b of BATS) {
    b.a += b.sp * b.dir * dt;
    const wx = 25.5 + Math.cos(b.a) * b.r, wz = 17.5 + Math.sin(b.a) * b.r, wy = b.h + Math.sin(t * 2 + b.r) * 1.5;
    const q = proj(wx, wy, wz), flap = Math.sin(t * 18 + b.r) > 0;
    put(q.x, q.y, C.bat, q.z);
    if (flap) { put(q.x - 1, q.y - 1, C.bat, q.z); put(q.x + 1, q.y - 1, C.bat, q.z); put(q.x - 2, q.y - 1, C.bat, q.z); put(q.x + 2, q.y - 1, C.bat, q.z); }
    else { put(q.x - 1, q.y, C.bat, q.z); put(q.x + 1, q.y, C.bat, q.z); put(q.x - 2, q.y + 1, C.bat, q.z); put(q.x + 2, q.y + 1, C.bat, q.z); }
  }
  // fireflies
  for (const f of FLIES) {
    f.ph += dt * f.sp;
    const wx = f.x + Math.sin(f.ph * 0.9) * 1.6, wz = f.z + Math.cos(f.ph * 0.7) * 1.6, wy = f.y + Math.sin(f.ph * 1.7) * 0.4;
    const glow = Math.sin(f.ph * 3 + f.x);
    if (glow < 0.1) continue;
    const q = proj(wx, wy, wz);
    put(q.x, q.y, glow > 0.6 ? C.fly : C.flyD, q.z);
    if (glow > 0.8 && q.z < 40) { put(q.x + 1, q.y, C.flyD, q.z); put(q.x, q.y + 1, C.flyD, q.z); }
  }
  // particles
  const np = [];
  for (const p of PARTS) {
    p.life -= dt; if (p.life <= 0) continue;
    p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
    if (p.g) p.vy -= 22 * dt;
    if (p.k === 'smoke') { p.vx *= 0.995; }
    if (p.k === 'dust') { p.vx *= 0.9; p.vz *= 0.9; p.vy -= 6 * dt; }
    if (p.k === 'drop' && p.y < WATER_Y) continue;
    if (p.k === 'coin' && p.vy < 0) { const wet = inMoat(p.x, p.z); if (p.y < (wet ? WATER_Y : 0)) { if (wet) continue; p.y = 0; p.vy *= -0.45; p.vx *= 0.6; p.vz *= 0.6; } }
    np.push(p);
    const q = proj(p.x, p.y, p.z);
    if (p.k === 'ember') put(q.x, q.y, p.life > 0.6 ? C.flame2 : C.flame4, q.z);
    else if (p.k === 'smoke') { const a = p.life / p.max, r = 1 + Math.round((1 - a) * 2); for (let yy = -r; yy <= r; yy++) for (let xx = -r; xx <= r; xx++) if (xx * xx + yy * yy <= r * r && bay(q.x + xx, q.y + yy) < a - 0.25) put(q.x + xx, q.y + yy, a > 0.55 ? C.smoke : C.smoke2, q.z); }
    else if (p.k === 'drop') { put(q.x, q.y, C.foam, q.z); }
    else if (p.k === 'dust') { put(q.x, q.y, c32(150, 130, 110), q.z); }
    else if (p.k === 'coin') { const sp = Math.sin(t * 14 + p.ph); put(q.x, q.y, sp > 0 ? C.goldL : C.gold, q.z); if (Math.abs(sp) > 0.4) put(q.x, q.y + 1, C.goldD, q.z); }
  }
  PARTS = np;
  drawPlayer(t);
  fctx.putImageData(fxImg, 0, 0);
  ctx.drawImage(fxC, 0, 0);

  // pixel-dissolve transitions
  const fade = leaving ? Math.min(1, leaveT / 0.8) : Math.max(0, 1 - introT / 1.0);
  if (fade > 0) {
    ctx.fillStyle = '#07061a';
    for (let y = 0; y < H; y += 2) for (let x = 0; x < W; x += 2) if (bay(x >> 1, y >> 1) + 0.5 < fade) ctx.fillRect(x, y, 2, 2);
  }
}

// ---------- layout ----------
const stage = document.getElementById('stage');
function layout() {
  let s = Math.min(innerWidth / W, innerHeight / H);
  if (s >= 3) s = Math.floor(s);
  stage.style.width = Math.round(W * s) + 'px'; stage.style.height = Math.round(H * s) + 'px';
  const fs = Math.max(8, Math.round(s * 3));
  document.querySelectorAll('.hud').forEach(e => e.style.fontSize = (e.id === 'title' ? fs * 1.2 : e.id === 'help' ? fs * 0.8 : fs) + 'px');
  document.getElementById('back').style.fontSize = Math.round(fs * 0.8) + 'px';
}
addEventListener('resize', layout); layout();

// ---------- loop ----------
let last = performance.now(), T = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; T += dt; introT += dt;
  update(dt, T);
  if (leaving) { leaveT += dt; if (leaveT > 0.9) { location.href = leaving.href; leaving = null; } }
  if (toastT > 0) { toastT -= dt; if (toastT <= 0) $toast.style.display = 'none'; }
  render(T, dt);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__castle = { P, proj, keys };   // handy for poking around in devtools
</script>
</body>
</html>
